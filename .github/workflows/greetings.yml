name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "🎉 Thanks for opening your first issue in this repo! We appreciate your contribution 🚀 Our team will review it soon. In the meantime: Make sure you’ve provided enough details. Check if a similar issue already exists. Don’t hesitate to ask questions! Welcome aboard! 🙌"
        pr-message: "Thanks a lot for contributing — your effort means a lot to this project.💡 The maintainers will review it shortly."
